name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish @avesra packages
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the tag to point at main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} does not point at a commit on main."
            exit 1
          fi

      - name: Read version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must be a version like v0.0.1 (got ${TAG})."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Require npm token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "Add an npm Automation token as the NPM_TOKEN repository secret."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install
        run: npm ci

      - name: Require tag to match package versions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node <<'EOF'
          const fs = require('fs');
          const version = process.env.VERSION;
          const angular = JSON.parse(fs.readFileSync('projects/angular/package.json', 'utf8')).version;
          const styles = JSON.parse(fs.readFileSync('projects/styles/package.json', 'utf8')).version;
          if (angular !== version) {
            console.error(`Tag v${version} does not match @avesra/angular version ${angular}.`);
            process.exit(1);
          }
          if (styles !== version) {
            console.error(`@avesra/styles version ${styles} does not match @avesra/angular version ${angular}.`);
            process.exit(1);
          }
          EOF

      - name: Build libraries
        run: |
          npx ng build styles --configuration production
          npx ng build angular --configuration production

      - name: Publish @avesra/styles
        working-directory: dist/styles
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Publish @avesra/angular
        working-directory: dist/angular
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          node <<'EOF'
          const fs = require('fs');
          const { execFileSync } = require('child_process');

          const tag = process.env.TAG;
          const repo = process.env.GITHUB_REPOSITORY;
          const nav = fs.readFileSync('projects/docs/src/app/config/docs-nav.config.ts', 'utf8');
          const docsVersion = nav.match(/DOCS_VERSION = '([^']+)'/)?.[1] ?? '';
          const changelog = fs.readFileSync('projects/docs/src/app/pages/changelog/changelog.data.ts', 'utf8');

          function quotedList(block, key) {
            const match = block.match(new RegExp(key + ': \\[([\\s\\S]*?)\\]'));
            if (!match) return [];
            return [...match[1].matchAll(/'([^']+)'/g)].map((item) => item[1]);
          }

          let highlights = [];
          for (const entry of changelog.split(/\n  \{/).slice(1)) {
            const field = entry.match(/version: ([^,\n]+)/)?.[1]?.trim() ?? '';
            const version = field === 'DOCS_VERSION' ? docsVersion : field.replace(/['"]/g, '');
            if (version === tag) {
              highlights = quotedList(entry, 'highlights');
              break;
            }
          }

          const inside = highlights.length
            ? highlights.map((line) => `- ${line}`).join('\n')
            : '- See the commits below.';

          const generated = execFileSync(
            'gh',
            [
              'api',
              '--method', 'POST',
              '-H', 'Accept: application/vnd.github+json',
              `/repos/${repo}/releases/generate-notes`,
              '-f', `tag_name=${tag}`,
              '-q', '.body',
            ],
            { encoding: 'utf8' },
          );

          const changelogLine = generated
            .split('\n')
            .find((line) => line.startsWith('**Full Changelog**:')) ?? '';
          const changed = generated
            .split('\n')
            .filter((line) => !line.startsWith('**Full Changelog**:'))
            .join('\n')
            .trim();

          const body = [
            "## What's Inside",
            '',
            inside,
            '',
            changed,
            '',
            '## Full Release Note',
            '',
            'https://avesra.com/docs/changelog',
            '',
            changelogLine,
            '',
          ].join('\n');

          fs.writeFileSync('release-notes.md', body);
          EOF
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --latest
