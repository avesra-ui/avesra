name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: tags
        run: |
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "full=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.short }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.full }}

  deploy:
    name: Deploy on server
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pack deploy files
        run: tar -czf deploy-bundle.tar.gz docker-compose.yml deploy/nginx/docker/default.conf

      - name: Upload deploy bundle to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: deploy-bundle.tar.gz
          target: /tmp

      - name: Pull images and restart stack
        uses: appleboy/ssh-action@v1.2.2
        env:
          AVESRA_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ secrets.GHCR_USER || github.actor }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: AVESRA_IMAGE,GHCR_PAT,GHCR_USER
          script: |
            set -euo pipefail

            APP_ROOT="/var/www/avesra"
            mkdir -p "${APP_ROOT}"
            tar -xzf /tmp/deploy-bundle.tar.gz -C "${APP_ROOT}"
            rm -f /tmp/deploy-bundle.tar.gz

            if systemctl is-active --quiet nginx; then
              sudo systemctl stop nginx
              sudo systemctl disable nginx
            fi

            cd "${APP_ROOT}"
            export AVESRA_IMAGE

            if [ -z "${GHCR_PAT:-}" ]; then
              echo "Missing repo secret GHCR_PAT (classic PAT with read:packages)."
              exit 1
            fi
            printf '%s' "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull
            docker compose up -d
            docker compose ps

            docker image prune -f

            echo "Deployment successful"
            echo "Image: $AVESRA_IMAGE"
