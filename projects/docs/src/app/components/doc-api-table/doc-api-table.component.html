<div av-table variant="secondary">
  <div av-table-scroll-container>
    <table av-table-content aria-label="API properties">
      <thead av-table-header>
        <tr>
          <th av-table-column>Prop</th>
          <th av-table-column>Type</th>
          <th av-table-column class="av-doc-api-table__default-col">Default</th>
          <th av-table-column>Description</th>
        </tr>
      </thead>
      <tbody av-table-body>
        @for (prop of props(); track $index) {
          <tr av-table-row>
            <td av-table-cell>
              <code class="av-doc-api-table__prop">{{ prop.name }}</code>
            </td>
            <td av-table-cell>
              <code class="av-doc-api-table__type">{{ prop.type }}</code>
            </td>
            <td av-table-cell class="av-doc-api-table__default-col">
              @if (prop.default) {
                <code class="av-doc-api-table__default">{{ prop.default }}</code>
              } @else {
                <span class="av-doc-api-table__empty">—</span>
              }
            </td>
            <td av-table-cell>{{ prop.description }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
