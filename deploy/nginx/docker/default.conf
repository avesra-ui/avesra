# Nginx in Docker (see docker-compose.yml). Certs: /etc/letsencrypt on the host.

server {
    listen 80;
    listen [::]:80;
    server_name avesra.com www.avesra.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name avesra.com www.avesra.com;

    ssl_certificate /etc/letsencrypt/live/avesra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avesra.com/privkey.pem;

    location / {
        proxy_pass http://avesra:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
