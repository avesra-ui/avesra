# Install on Ubuntu:
#   sudo apt install -y nginx certbot python3-certbot-nginx
#   sudo cp deploy/nginx/avesra.com.conf /etc/nginx/sites-available/avesra.com
#   sudo ln -sf /etc/nginx/sites-available/avesra.com /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#
# First certificate (DNS must point to this server; use HTTP block below if no SSL yet):
#   sudo certbot --nginx -d avesra.com -d www.avesra.com
#
# Cloudflare: SSL/TLS mode "Full (strict)" once Let's Encrypt is active on origin.

# --- Optional: use only this server block until certbot succeeds, then enable HTTPS block ---
# server {
#     listen 80;
#     listen [::]:80;
#     server_name avesra.com www.avesra.com;
#     location / {
#         proxy_pass http://127.0.0.1:4000;
#         proxy_http_version 1.1;
#         proxy_set_header Host $host;
#         proxy_set_header X-Real-IP $remote_addr;
#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#     }
# }

server {
    listen 80;
    listen [::]:80;
    server_name avesra.com www.avesra.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name avesra.com www.avesra.com;

    ssl_certificate /etc/letsencrypt/live/avesra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avesra.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
