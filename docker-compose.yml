# TLS: Let's Encrypt on the host at /etc/letsencrypt (mounted read-only into nginx).
# Renew on the host (certbot), then reload proxy:
#   docker compose -f /var/www/avesra/docker-compose.yml exec -T nginx nginx -s reload
#
# One-time migration from system nginx:
#   sudo systemctl stop nginx && sudo systemctl disable nginx

services:
  avesra:
    image: ${AVESRA_IMAGE:-ghcr.io/avesra-ui/avesra:latest}
    container_name: avesra
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
    expose:
      - "4000"
    networks:
      - web

  nginx:
    image: nginx:1.27-alpine
    container_name: avesra-nginx
    restart: unless-stopped
    depends_on:
      - avesra
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/docker/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - web

networks:
  web:
